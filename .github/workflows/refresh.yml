name: Collect and publish

on:
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search and update listings
        if: github.event_name != 'push'
        env:
          USE_AI: "0"
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
        run: python scripts/collect.py

      - name: Merge hand-added items
        if: github.event_name == 'push'
        run: python scripts/collect.py --manual-only

      - name: Commit updated data
        run: |
          git config user.name "opportunities-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/positions.json data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh listings [skip ci]"
            git push
          fi

      - name: Prepare site
        run: |
          touch .nojekyll
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll icons data sources _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
